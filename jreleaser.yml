signing:
  active: ALWAYS
  armored: true
    
deploy:
  maven:
    # JasperReports' itext is only on Jaspersoft's repository, so the pom keeps a <repositories>
    # block, which strict mode rejects.
    pomchecker:
      strict: false
    mavenCentral:
      sonatype:
        active: RELEASE
        url: https://central.sonatype.com/api/v1/publisher
        stagingRepositories:
          - target/staging-deploy
