#Plugins

perun.admin_console.perun_plugin_table_editor.help=Use the Plugin Table Editor to manage plugin definitions
perun.admin_console.perun_plugin_table_editor.help_l=Use the Plugin Table Editor to manage plugin definitions. Create, edit, or remove plugins, configure their properties, JavaScript resources, icons, permissions, menu configuration, version, and display order. Ensure all required fields are completed correctly before saving.
perun.admin_console.perun_plugin_table_editor.form.context_name.help=Enter the unique identifier used to reference the plugin within the application.
perun.admin_console.perun_plugin_table_editor.form.label_code.help=Specify the localization label code used to display the plugin name in the user interface.
perun.admin_console.perun_plugin_table_editor.form.javascript_path.help=Provide the path to the JavaScript file that implements the plugin functionality.
perun.admin_console.perun_plugin_table_editor.form.img_path.help=Specify the path to the icon or image displayed for the plugin.
perun.admin_console.perun_plugin_table_editor.form.permission_code.help=Enter the permission code required to access the plugin. Only authorized users with the specified permission can use it.
