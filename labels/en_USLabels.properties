#USER MANAGMENT
perun.admin_console.manage_users.help=The User Management section allows administrators to create users.
perun.admin_console.manage_users.help_l=The User Management section allows administrators to create, view, edit, and manage user accounts within the system. From this section, you can assign roles and permissions, activate or deactivate user accounts, reset passwords when necessary, and maintain user access to ensure secure and efficient system administration.

#Org Units

perun.admin_console.organizational_units.help=The Organizational Units section allows administrators to create
perun.admin_console.organizational_units.help_l=The Organizational Units section allows administrators to create, view, edit, and manage the organizational structure within the system. Organizational units can be used to represent departments, divisions, offices, or other administrative entities. Properly configuring these units helps organize users, define reporting structures, and support role-based access and system processes.
perun.admin_console.organizational_units.form.parent_ou_id.help=Select the organizational unit that this unit belongs to. Leave this field empty if it is not part of another organizational unit.
perun.admin_console.organizational_units.form.name.help=Enter the name of the organizational unit.
perun.admin_console.organizational_units.form.address.help=Enter the address of the organizational unit.
perun.admin_console.organizational_units.form.phone.help=Enter the contact phone number for the organizational unit.
perun.admin_console.organizational_units.form.e_mail.help=Enter the contact email address for the organizational unit.
perun.admin_console.organizational_units.form.org_unit_type.help=Select the type of organizational unit (for example, Headquarters, Regional Office, or Department).
perun.admin_console.organizational_units.form.external_id.help=Enter an external identifier if one is used by another system. Leave blank if not applicable.

#Codelist editor 

perun.admin_console.codelist_editor.help=The Code List Editor allows you to create.
perun.admin_console.codelist_editor.help_l=The Code List Editor allows you to create, manage, and maintain code lists used throughout the system. Code lists provide predefined values for dropdown menus, classifications, statuses, categories, and other standardized data. By managing code lists centrally, you ensure consistency, improve data quality, and simplify system administration. Changes made to a code list are automatically reflected wherever that code list is used within the system.
perun.admin_console.codelist_editor.form.codes_code_type.help=Select the type of code.
perun.admin_console.codelist_editor.form.codes_code_value.help=Enter a unique value for the code.
perun.admin_console.codelist_editor.form.codes_label_code.help=Enter the label code associated with this code.
perun.admin_console.codelist_editor.form.codes_sort_order.help=Enter the display order for this code.
perun.admin_console.codelist_editor.form.codes_parent_code_value.help=Select the parent code, if applicable.
perun.admin_console.codelist_editor.form.labels_label_text.help=Enter the text displayed to users.
perun.admin_console.codelist_editor.form.labels_locale_id.help=Select the language in which this label will be displayed.
perun.admin_console.codelist_editor.form.labels_label_descr.help=Enter an optional description for this label.

#Labels

perun.admin_console.label_editor.help=The Label Editor allows you to create, edit.
perun.admin_console.label_editor.help_l=The Label Editor allows you to create, edit, and manage the text labels displayed throughout the system. Labels are used for user interface elements such as field names, buttons, messages, and help text. The Label Editor also supports multiple languages, enabling you to provide localized translations and ensure a consistent user experience across different locales.
perun.admin_console.label_editor.form.label_code.help=Enter a unique code to identify the label.
perun.admin_console.label_editor.form.label_text.help=Enter the text that will be displayed to users.
perun.admin_console.label_editor.form.locale_id.help=Select the language in which this label will be displayed.
perun.admin_console.label_editor.form.label_descr.help=Enter an optional description for this label.

# Configuration logs

perun.admin_console.svarog_config_log.help=The Svarog Configuration Log provides a detailed history of configuration changes.
perun.admin_console.svarog_config_log.help_l=The Svarog Configuration Log provides a detailed history of configuration changes made within the system. It enables administrators to monitor and review modifications to system settings, helping ensure transparency and accountability. Each log entry records information such as the configuration item that was changed, the type of change performed, the user who made the change, and the date and time it occurred. This information supports system auditing, troubleshooting, compliance requirements, and the investigation of configuration-related issues by maintaining a complete history of configuration updates.


#GIS layers


perun.admin_console.geo_layer_types.help=The Geo Layer Types section allows administrators to create, configure, and manage the geographic layer
perun.admin_console.geo_layer_types.help_l=The Geo Layer Types section allows administrators to create, configure, and manage the geographic layer types used throughout the system. Geo layer types define how geographic information is organized, displayed, and processed on maps. They are used to categorize spatial data, control layer properties, and support map-based functionality. Proper configuration of geo layer types ensures consistent visualization, efficient data management, and accurate representation of geographic information across the system.
perun.admin_console.geo_layer_types.form.title.help=Enter the name of the geo layer type.
perun.admin_console.geo_layer_types.form.layer_type.help=Select whether this layer is a Base Map (background map) or an Overlay (additional information displayed on the map).
perun.admin_console.geo_layer_types.form.module_name.help=Enter the name of the associated module.
perun.admin_console.geo_layer_types.form.layer_group.help=Select the group to which this layer belongs.
perun.admin_console.geo_layer_types.form.label_code.help=Select the label code used to display the layer name.
perun.admin_console.geo_layer_types.form.url.help=Enter the URL of the map service.
perun.admin_console.geo_layer_types.form.protocol.help=Select the communication protocol for the map service.
perun.admin_console.geo_layer_types.form.version.help=Enter the version of the map service.
perun.admin_console.geo_layer_types.form.format.help=Select the format used to display the map data.

