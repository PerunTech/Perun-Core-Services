perun.admin_console.svarog_tables.help=The Svarog Tables section allows administrators to create, configure, and manage the database tables
perun.admin_console.svarog_tables.help_l=The Svarog Tables section allows administrators to create, configure, and manage the database tables and fields used by the system. It provides configuration options for table structures, field definitions, relationships, caching, constraints, indexes, and code lists. Proper configuration helps ensure data integrity, system performance, and consistent data management across the application. After creating or modifying table definitions, you must run the system upgrade process to apply the changes to the database.
