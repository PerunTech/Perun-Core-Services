perun.admin_console.perun_plugin_table_editor.form.version.help=Specify the plugin version for identification and compatibility purposes.
perun.admin_console.perun_plugin_table_editor.form.sort_order.help=Enter the display order of the plugin. Lower values are displayed before higher values.


#Perun Menu editor 

perun.admin_console.perun_menu_editor.help=Use the Menu Editor to manage application menu definitions
perun.admin_console.perun_menu_editor.help_l=Use the Menu Editor to manage application menu definitions. Create, edit, or remove menu entries, configure their type, structure, and properties, and organize how they are displayed throughout the application. Define menu behavior, assign categories where applicable, and ensure all required fields are completed before saving.
perun.admin_console.perun_menu_editor.form.menu_code.help=Enter the unique code that identifies the menu entry within the application. This value is used internally and should remain unique.
perun.admin_console.perun_menu_editor.form.menu_type.help=Select the type of menu entry. The selected type determines how the menu item is displayed and behaves within the application.
perun.admin_console.perun_menu_editor.form.menu_conf.help=Configure the menu definition and associated settings. Use the editor to define the menu structure, properties, and available options.
perun.admin_console.perun_menu_editor.form.internal_cat.help=Specify the internal category used to organize or group the menu entry. This value is intended for internal application configuration and categorization.





#Workflow Automaton

perun.admin_console.work_flow_auto.help=The Workflow Automaton section allows administrators to create and manage workflow automation rules within the system
perun.admin_console.work_flow_auto.help_l=The Workflow Automaton section allows administrators to create and manage workflow automation rules within the system. Workflow  define how business processes are executed by automatically controlling transitions between workflow states based on predefined conditions and permissions. This helps ensure that processes are performed consistently, reduces manual intervention, and enforces business rules throughout the workflow lifecycle.
perun.admin_console.work_flow_auto.form.workflow_type.help=Select the workflow to which this automaton belongs.
perun.admin_console.work_flow_auto.form.workflow_automaton_label.help=Enter a name for the workflow automaton.
