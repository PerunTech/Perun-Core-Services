#Config tables




perun.admin_console.svarog_config_tables.help=The Svarog Configuration Tables section allows administrators to create, configure, and manage the database tables
perun.admin_console.svarog_config_tables.help_l=The Svarog Configuration Tables section allows administrators to create, configure, and manage the database tables and fields used to store system configuration data. It provides configuration options for table structures, field definitions, relationships, caching, constraints, indexes, and code lists. Proper configuration helps ensure data integrity, system performance, and consistent management of configuration data across the application. After creating or modifying table definitions, you must run the system upgrade process to apply the changes to the database.
